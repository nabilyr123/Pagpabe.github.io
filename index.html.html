    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 2;
            padding: 0;
            background-color: #3a0480;
            color: #fff7f7;
            line-height: 1.6;
        }
        header {
            background: linear-gradient(135deg, #660494, #f50000);
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: 3rem;
        }
        header p {
            font-size: 1.2rem;
            margin: 10px 0;
        }
        header img {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 20px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.5);
        }
        nav {
            background-color: #660494;
            padding: 10px;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.2);
        }
        nav ul {
            list-style: none;
            padding: 0;
            text-align: center;
        }
        nav ul li {
            display: inline-block;
            margin-right: 20px;
        }
        nav ul li a {
            color: #fff;
            text-decoration: none;
            font-size: 18px;
            position: relative;
        }
        nav ul li a:hover {
            color: #f50000;
        }
        nav ul li a::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 2px;
            background-color: #f50000;
            bottom: -5px;
            left: 0;
            transform: scaleX(0);
            transition: transform 0.3s ease-in-out;
